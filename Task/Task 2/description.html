 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Description List</title>
    <style>
       
        dl{
             background-color:beige;
          }
        dt{
            color:brown;
            text-align: center;
            font-family: Georgia;
            font-size: 20px;
            padding: 10px;
             }
        dd{  
            color: darkgreen;
            text-shadow: 1px 1px whitesmoke;
            border: 2px groove black;
         
        }
    </style>
 </head>
 <body>
    
    <dl>
        <dt>Web Development</dt>
        <dd>This website is built with the help of HTML and CSS.</dd>
        <dt>HTML</dt>
        <dd>HTML-HyperText Markup Language is the standard markup language used to create and structure web pages.</dd>
        <dt>CSS</dt>
        <dd>CSS-Cascading Style Sheets is a style sheet language used to style and design HTML web pages.</dd>
    </dl>
 
 </body>
 </html>
